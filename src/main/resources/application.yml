server:
  port: 8080

spring:
  application:
    name: pjl-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local} # Default to local profile

  datasource:
    # URL, Username, and Password should be injected via standard environment variables
    # (e.g. SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD)
    # when deployed in production (e.g. Render).
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 100MB

gemini:
  api:
    base-url: https://generativelanguage.googleapis.com
    key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash

frontend:
  origin: ${FRONTEND_ORIGIN:*}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.web.servlet.mvc.method.annotation: DEBUG
